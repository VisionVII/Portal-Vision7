name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-supabase:
    name: Apply Supabase migrations and functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Keep the action and CLI aligned with the official Supabase CI example.
      # The repository lockfile currently resolves the CLI to 2.109.0.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Validate Supabase credentials and project access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          expected_project_ref="xhpfxvoonpclonjyfimt"
          if [ "$SUPABASE_PROJECT_REF" != "$expected_project_ref" ]; then
            echo "::error::SUPABASE_PROJECT_REF está incorreto para este repositório. Esperado: $expected_project_ref"
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN está vazio no environment production."
            exit 1
          fi

          response_file="$(mktemp)"
          status_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"

          case "$status_code" in
            200)
              echo "Supabase Management API confirmou acesso ao projeto $SUPABASE_PROJECT_REF."
              ;;
            401)
              echo "::error::SUPABASE_ACCESS_TOKEN inválido, expirado ou revogado (HTTP 401)."
              exit 1
              ;;
            403)
              echo "::error::SUPABASE_ACCESS_TOKEN válido, mas sem permissões para este projeto (HTTP 403). Use Owner/Administrator ou PAT com Project Settings Read e escopo no projeto."
              exit 1
              ;;
            404)
              echo "::error::Projeto $SUPABASE_PROJECT_REF não foi encontrado ou não é acessível por este token (HTTP 404)."
              exit 1
              ;;
            *)
              echo "::error::Supabase Management API retornou HTTP $status_code. Resposta sanitizada:"
              sed -E 's/"(access_token|token|key|secret|password)"[[:space:]]*:[[:space:]]*"[^"]*"/"\1":"[REDACTED]"/gi' "$response_file" | head -c 1000
              exit 1
              ;;
          esac

          rm -f "$response_file"

      - name: Apply database migrations
        # GitHub-hosted runners may not support IPv6. Use the IPv4 Transaction
        # Pooler URL from Supabase Dashboard > Connect instead of `supabase link`
        # followed by a direct database connection.
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy Edge Functions
        run: |
          for function_dir in supabase/functions/*; do
            [ -d "$function_dir" ] || continue
            [ -f "$function_dir/index.ts" ] || continue
            function_name="$(basename "$function_dir")"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  deploy-vercel:
    name: Deploy web application
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-supabase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm install --legacy-peer-deps

      - name: Validate production build
        run: npm run build

      - name: Validate Vercel account and project access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Um ou mais secrets Vercel estão vazios no environment production."
            exit 1
          fi

          user_file="$(mktemp)"
          user_status="$(curl --silent --show-error --output "$user_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v2/user')"

          case "$user_status" in
            200)
              echo "Token Vercel autenticado com sucesso."
              ;;
            401)
              echo "::error::VERCEL_TOKEN inválido, expirado ou revogado (HTTP 401)."
              exit 1
              ;;
            *)
              echo "::error::API Vercel rejeitou a identidade do token (HTTP $user_status)."
              exit 1
              ;;
          esac

          project_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"

          case "$project_status" in
            200)
              echo "Token Vercel tem acesso ao projeto $VERCEL_PROJECT_ID na equipa $VERCEL_ORG_ID."
              ;;
            403)
              echo "::error::VERCEL_TOKEN é válido, mas a conta não tem acesso à equipa/projeto indicado (HTTP 403)."
              exit 1
              ;;
            404)
              echo "::error::Projeto Vercel não encontrado para este token/equipa (HTTP 404). Confirme VERCEL_PROJECT_ID e VERCEL_ORG_ID."
              exit 1
              ;;
            *)
              echo "::error::API Vercel retornou HTTP $project_status ao validar o projeto."
              exit 1
              ;;
          esac

          rm -f "$user_file"

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        run: npx vercel build --prod --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
